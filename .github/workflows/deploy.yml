name: Deploy to WordPress.org

# Push a version tag (for example 1.0.1) to publish that version.
# Running the workflow by hand is a dry run: nothing is committed to WordPress.org.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event_name != 'push' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: cindova-phone-otp-sms-for-gravity-forms
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}
